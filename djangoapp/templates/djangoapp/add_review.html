<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Review - {{ dealer.name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Dealerships App</a>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                <span class="navbar-text me-3 text-white">Welcome, {{ user.username }}</span>
                <a class="btn btn-outline-light" href="/admin/logout/">Logout</a>
                {% else %}
                <a class="btn btn-outline-light me-2" href="/admin/login/">Login</a>
                <a class="btn btn-primary" href="#">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <h2>Write a Review for {{ dealer.name }}</h2>
        <form method="POST" class="mt-4">
            {% csrf_token %}
            <div class="mb-3">
                <label for="content" class="form-label">Review Content</label>
                <textarea class="form-control" id="content" name="content" rows="4" required>Great dealership! Fast financing, friendly sales reps, and easy delivery process.</textarea>
            </div>
            
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="purchase" name="purchase" checked>
                <label class="form-check-label" for="purchase">
                    Has purchased car from this dealership?
                </label>
            </div>

            <div class="mb-3">
                <label for="car" class="form-label">Car Make & Model</label>
                <input type="text" class="form-control" id="car" name="car" value="Toyota Camry 2023" required>
            </div>

            <div class="mb-3">
                <label for="purchase_date" class="form-label">Purchase Date</label>
                <input type="date" class="form-control" id="purchase_date" name="purchase_date" value="2024-05-15" required>
            </div>

            <button type="submit" class="btn btn-primary mt-2">Submit Review</button>
        </form>
    </div>
</body>
</html>
