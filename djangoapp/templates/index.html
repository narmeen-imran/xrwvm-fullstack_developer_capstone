<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dealerships</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-link navbar-brand" href="#">Dealerships App</a>
            <div class="d-flex">
                <a class="btn btn-outline-light me-2" href="/admin/login/">Login</a>
                <a class="btn btn-primary" href="#">Register</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Available Dealerships</h2>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Dealer Name</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Address</th>
                    <th>Zip</th>
                </tr>
            </thead>
            <tbody>
                {% for dealer in dealers %}
                <tr>
                    <td>{{ dealer.id }}</td>
                    <td>{{ dealer.name }}</td>
                    <td>{{ dealer.city }}</td>
                    <td>{{ dealer.state }}</td>
                    <td>{{ dealer.address }}</td>
                    <td>{{ dealer.zip }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
