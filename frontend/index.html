<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Car Dealership Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚗 Car Dealerships Portal</h1>
  </header>
  
  <main>
    <!-- Dealership View -->
    <section id="dealer-section">
      <h2>Select a Dealership</h2>
      <div id="dealers-container">Loading dealerships...</div>
    </section>

    <!-- Reviews View (Hidden by default) -->
    <section id="review-section" style="display: none;">
      <button class="btn-back" onclick="showDealers()">← Back to Dealerships</button>
      <h2 id="dealer-title"></h2>
      <h3>Customer Reviews</h3>
      <div id="reviews-container">Loading reviews...</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
